name: Windows executable

on:
  push:
    branches: [main, improvement/v25-tactics, improvement/v26-ryan]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 20
    outputs:
      artifact: ${{ steps.names.outputs.artifact }}
      tag: ${{ steps.names.outputs.tag }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12.10'
          architecture: x64
          cache: pip
          cache-dependency-path: windows/requirements-build.txt
      - name: Name build
        id: names
        shell: pwsh
        run: |
          $short = '${{ github.sha }}'.Substring(0, 12)
          "artifact=AltruAgentRedAlert-Windows-x64-$short" >> $env:GITHUB_OUTPUT
          "tag=redalert-v2-$short" >> $env:GITHUB_OUTPUT
      - name: Install pinned build dependencies
        run: |
          python -m pip install -r windows/requirements-build.txt
          python -m pip install --no-deps -e .
      - name: Test policy and launcher
        run: python -m pytest tests redalert_bot_tests windows/tests -q
      - name: Build and test actual Windows executable
        run: python windows/build.py
      - name: Upload Windows files
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.names.outputs.artifact }}
          path: release/*
          if-no-files-found: error
          retention-days: 90
      - name: Upload build diagnostics on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: Windows-build-diagnostics
          path: build/AltruAgentRedAlert/warn-AltruAgentRedAlert.txt
          if-no-files-found: ignore

  release:
    needs: build
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: ${{ needs.build.outputs.artifact }}
          path: release
      - name: Publish executable and source commit
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ needs.build.outputs.tag }}
          SOURCE_COMMIT: ${{ github.sha }}
        run: |
          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            gh release upload "$RELEASE_TAG" release/* --clobber
          else
            gh release create "$RELEASE_TAG" release/* --target "$SOURCE_COMMIT" --title "Red Alert Windows bot ${SOURCE_COMMIT:0:12}" --notes-file windows/RELEASE_NOTES.md
          fi
